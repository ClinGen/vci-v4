name: CI

on:
  pull_request:
  push:
    branches: [main]

# Public repo: this workflow only reads code and holds no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: vci
          POSTGRES_USER: vci
          POSTGRES_PASSWORD: vci-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vci -d vci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://vci:vci-ci-only@localhost:5432/vci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Test (includes migration round trip and database constraints)
        run: pytest
      - name: Build production image
        run: docker build --target production .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit tests (SVCv4 scoring rules)
        run: npm test
      - name: Type-check and build
        run: npm run build
